<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit-Dodge · Radial Gravity Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 20% 30%, #0b0f1c, #03050b);
            font-family: 'Segoe UI', system-ui, monospace;
        }
        .game-wrapper {
            background: #111722;
            border-radius: 2rem;
            padding: 1.2rem 1.2rem 1.5rem;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.8), 0 0 0 2px #2a3a55 inset;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 50%;
            background: #04060c;
            box-shadow: 0 0 50px #2f4b7c55, 0 0 0 3px #1e2c3a inset;
            cursor: pointer;
            touch-action: none;
        }
        .hud {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 0.8rem;
            padding: 0 0.3rem;
            color: #adc6ff;
            font-weight: 500;
            letter-spacing: 1px;
            text-shadow: 0 0 8px #4d7cff88;
        }
        .score {
            background: #0e141e;
            padding: 0.4rem 1.2rem;
            border-radius: 3rem;
            font-size: 1.4rem;
            border: 1px solid #3d5f8b;
            box-shadow: 0 0 12px #1e3b66 inset;
        }
        button {
            background: #1b2537;
            border: none;
            color: #d0e2ff;
            font-size: 1rem;
            padding: 0.5rem 1.2rem;
            border-radius: 3rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 0 #0b0f18, 0 0 0 1px #3d5f8b inset;
            transition: 0.06s linear;
            border: 1px solid #4f6e96;
        }
        button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0b0f18, 0 0 0 1px #3d5f8b inset;
        }
        .hint {
            color: #6b85b0;
            font-size: 0.9rem;
            display: flex;
            gap: 1rem;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="700" height="700"></canvas>
    <div class="hud">
        <div class="score">🛰️ <span id="scoreDisplay">0</span></div>
        <div class="hint">
            <span>← → / tap sides</span>
            <button id="resetButton">↻ RESTART</button>
        </div>
    </div>
</div>
<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');

        // ----- FIXED DIMENSIONS -----
        const W = 700, H = 700;
        const CENTER_X = W / 2;
        const CENTER_Y = H / 2;
        const PLANET_RADIUS = 80;          // visual & gravity center
        const ORBIT_RADIUS = 190;          // satellite orbit radius
        const SAT_SIZE = 12;               // half-size of satellite

        // ----- GAME STATE -----
        let angle = 0;                     // satellite angle (radians)
        const ANGLE_SPEED = 0.035;         // per frame (left/right)
        let asteroids = [];
        let score = 0;
        let gameOver = false;

        // ----- SPAWN CONTROL -----
        let spawnTimer = 0;
        const SPAWN_INTERVAL = 28;         // frames between spawns
        const ASTEROID_MIN_R = 8;
        const ASTEROID_MAX_R = 18;
        const ASTEROID_SPEED = 2.1;        // pixels per frame toward center

        // ----- INPUT -----
        let leftPressed = false;
        let rightPressed = false;

        // ----- RESET -----
        function resetGame() {
            angle = 0;
            asteroids = [];
            score = 0;
            gameOver = false;
            spawnTimer = 0;
            leftPressed = false;
            rightPressed = false;
            scoreSpan.textContent = '0';
        }

        // ----- SPAWN ASTEROID -----
        function spawnAsteroid() {
            // Random angle at outer edge (just beyond canvas, but we use orbit radius + margin)
            const spawnAngle = Math.random() * Math.PI * 2;
            const spawnDist = ORBIT_RADIUS + 100 + Math.random() * 80; // 290..370 from center

            const x = CENTER_X + Math.cos(spawnAngle) * spawnDist;
            const y = CENTER_Y + Math.sin(spawnAngle) * spawnDist;

            const radius = ASTEROID_MIN_R + Math.random() * (ASTEROID_MAX_R - ASTEROID_MIN_R);
            // Direction vector: from asteroid position toward center
            const dx = CENTER_X - x;
            const dy = CENTER_Y - y;
            const len = Math.hypot(dx, dy);
            const vx = (dx / len) * ASTEROID_SPEED;
            const vy = (dy / len) * ASTEROID_SPEED;

            asteroids.push({
                x, y,
                vx, vy,
                radius,
                // for slight variety, rotation (visual only)
                rot: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.03
            });
        }

        // ----- UPDATE -----
        function update() {
            if (gameOver) return;

            // --- rotate satellite (left/right) ---
            if (leftPressed) angle -= ANGLE_SPEED;
            if (rightPressed) angle += ANGLE_SPEED;

            // keep angle in [0, 2pi] for sanity
            angle = ((angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);

            // --- spawn asteroids ---
            spawnTimer++;
            if (spawnTimer >= SPAWN_INTERVAL) {
                spawnTimer = 0;
                spawnAsteroid();
                // occasionally spawn two at once (increases difficulty slightly)
                if (score > 10 && Math.random() < 0.25) spawnAsteroid();
                if (score > 25 && Math.random() < 0.3) spawnAsteroid();
            }

            // --- move asteroids & collision / removal ---
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const a = asteroids[i];
                a.x += a.vx;
                a.y += a.vy;
                a.rot += a.rotSpeed;

                // if asteroid reaches near planet (absorbed) -> remove, no score
                const distToCenter = Math.hypot(a.x - CENTER_X, a.y - CENTER_Y);
                if (distToCenter < PLANET_RADIUS - 4) {
                    asteroids.splice(i, 1);
                    continue;
                }

                // --- collision with satellite? (satellite at orbit radius) ---
                // satellite position
                const satX = CENTER_X + Math.cos(angle) * ORBIT_RADIUS;
                const satY = CENTER_Y + Math.sin(angle) * ORBIT_RADIUS;

                const distToSat = Math.hypot(a.x - satX, a.y - satY);
                // collision if distance < asteroid radius + satellite collision radius
                const collDist = a.radius + SAT_SIZE * 0.9; // slightly forgiving
                if (distToSat < collDist) {
                    gameOver = true;
                    break;  // stop checking, game over
                }
            }

            // if gameover was set in loop, don't score this frame
            if (gameOver) return;

            // --- score: count asteroids that are far outside orbit (escaped) ---
            // instead of removing them, we let them fly away & count them as dodged.
            // but we must remove them when they go too far to avoid clutter.
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const a = asteroids[i];
                const dist = Math.hypot(a.x - CENTER_X, a.y - CENTER_Y);
                // if asteroid is far beyond orbit (e.g., > 400) => it missed everything, remove & increase score
                if (dist > 420) {
                    asteroids.splice(i, 1);
                    score++;
                    scoreSpan.textContent = score;
                }
            }
        }

        // ----- DRAW -----
        function draw() {
            ctx.clearRect(0, 0, W, H);

            // --- background stars (static but looks nice) ---
            ctx.fillStyle = '#b3d0ff';
            for (let i = 0; i < 120; i++) {
                // deterministic pseudo-random positions
                const sx = (i * 37) % W;
                const sy = (i * 73) % H;
                const rad = 0.6 + (i % 3) * 0.5;
                ctx.beginPath();
                ctx.arc(sx, sy, rad, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(200, 220, 255, ${0.15 + (i % 5) * 0.08})`;
                ctx.fill();
            }

            // --- central planet (radial gravity) ---
            const planetGrad = ctx.createRadialGradient(CENTER_X-15, CENTER_Y-15, 15, CENTER_X, CENTER_Y, PLANET_RADIUS+20);
            planetGrad.addColorStop(0, '#6f9ed6');
            planetGrad.addColorStop(0.6, '#2a4b7a');
            planetGrad.addColorStop(1, '#0e1a2b');
            ctx.beginPath();
            ctx.arc(CENTER_X, CENTER_Y, PLANET_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = planetGrad;
            ctx.fill();
            ctx.shadowColor = '#7aa9ff';
            ctx.shadowBlur = 30;
            ctx.strokeStyle = '#aac9ff';
            ctx.lineWidth = 2.5;
            ctx.stroke();
            ctx.shadowBlur = 0; // reset

            // --- orbit ring (dashed) ---
            ctx.beginPath();
            ctx.arc(CENTER_X, CENTER_Y, ORBIT_RADIUS, 0, Math.PI * 2);
            ctx.strokeStyle = '#9bb9ff';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([8, 12]);
            ctx.stroke();
            ctx.setLineDash([]); // reset

            // --- asteroids ---
            for (const a of asteroids) {
                // draw irregular rock
                ctx.save();
                ctx.translate(a.x, a.y);
                ctx.rotate(a.rot);

                const r = a.radius;
                ctx.beginPath();
                // draw a blocky asteroid shape
                ctx.moveTo(-r*0.9, -r*0.6);
                ctx.lineTo(r*0.9, -r*0.7);
                ctx.lineTo(r*0.9, r*0.5);
                ctx.lineTo(r*0.3, r*0.9);
                ctx.lineTo(-r*0.7, r*0.8);
                ctx.lineTo(-r*0.9, -r*0.2);
                ctx.closePath();

                const rockGrad = ctx.createRadialGradient(-r*0.3, -r*0.3, r*0.1, 0, 0, r*1.2);
                rockGrad.addColorStop(0, '#b8b8c0');
                rockGrad.addColorStop(0.7, '#5a5f6b');
                rockGrad.addColorStop(1, '#2d323c');
                ctx.fillStyle = rockGrad;
                ctx.fill();
                ctx.strokeStyle = '#9a9aa5';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // little crater dots
                ctx.beginPath();
                ctx.arc(-r*0.3, -r*0.2, r*0.2, 0, Math.PI*2);
                ctx.fillStyle = '#3a3e4a';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(r*0.4, r*0.3, r*0.15, 0, Math.PI*2);
                ctx.fillStyle = '#4c4f5c';
                ctx.fill();

                ctx.restore();
            }

            // --- satellite (orbit position) ---
            const satX = CENTER_X + Math.cos(angle) * ORBIT_RADIUS;
            const satY = CENTER_Y + Math.sin(angle) * ORBIT_RADIUS;

            // glow around satellite
            ctx.shadowColor = '#7ff0ff';
            ctx.shadowBlur = 20;

            // draw small satellite: main body (rectangle) + solar panels
            ctx.save();
            ctx.translate(satX, satY);
            ctx.rotate(angle + Math.PI / 2); // orient along orbit tangent (looks nicer)

            // main body
            ctx.fillStyle = '#e0e9ff';
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#7ff0ff';
            ctx.beginPath();
            ctx.roundRect(-7, -4, 14, 8, 3);
            ctx.fill();
            ctx.strokeStyle = '#c0d0ff';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // solar panels
            ctx.fillStyle = '#9fb6ff';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.roundRect(-20, -3, 8, 6, 2);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(12, -3, 8, 6, 2);
            ctx.fill();

            // antenna
            ctx.beginPath();
            ctx.arc(0, -8, 3, 0, Math.PI * 2);
            ctx.fillStyle = '#d0e2ff';
            ctx.shadowBlur = 20;
            ctx.fill();

            ctx.restore();

            // reset shadow
            ctx.shadowBlur = 0;

            // --- game over overlay ---
            if (gameOver) {
                ctx.fillStyle = 'rgba(8, 12, 24, 0.8)';
                ctx.fillRect(0, 0, W, H);
                ctx.font = 'bold 48px "Segoe UI", system-ui, sans-serif';
                ctx.fillStyle = '#ffd966';
                ctx.shadowColor = '#ffaa33';
                ctx.shadowBlur = 20;
                ctx.textAlign = 'center';
                ctx.fillText('💥 GAME OVER', CENTER_X, CENTER_Y - 40);
                ctx.font = '28px "Segoe UI", sans-serif';
                ctx.fillStyle = '#c6dcff';
                ctx.fillText('click RESTART', CENTER_X, CENTER_Y + 50);
                ctx.shadowBlur = 0;
            }

            // --- score (on canvas, optional) but we have HUD
        }

        // helper canvas rounding
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.moveTo(x + r, y);
            this.lineTo(x + w - r, y);
            this.quadraticCurveTo(x + w, y, x + w, y + r);
            this.lineTo(x + w, y + h - r);
            this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            this.lineTo(x + r, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
            return this;
        };

        // ----- GAME LOOP -----
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ----- EVENT LISTENERS -----
        // keyboard
        function handleKeyDown(e) {
            if (e.key === 'ArrowLeft' || e.key === 'Left' || e.key === 'a' || e.key === 'A') {
                leftPressed = true;
                e.preventDefault();
            } else if (e.key === 'ArrowRight' || e.key === 'Right' || e.key === 'd' || e.key === 'D') {
                rightPressed = true;
                e.preventDefault();
            }
        }

        function handleKeyUp(e) {
            if (e.key === 'ArrowLeft' || e.key === 'Left' || e.key === 'a' || e.key === 'A') {
                leftPressed = false;
                e.preventDefault();
            } else if (e.key === 'ArrowRight' || e.key === 'Right' || e.key === 'd' || e.key === 'D') {
                rightPressed = false;
                e.preventDefault();
            }
        }

        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);

        // ----- MOUSE / TAP (click left/right side of canvas) -----
        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const canvasX = (e.clientX - rect.left) * scaleX;

            // if game over, clicking restarts (also button works)
            if (gameOver) {
                resetGame();
                return;
            }

            // left half = rotate CCW (left), right half = rotate CW (right)
            if (canvasX < W / 2) {
                leftPressed = true;
                // auto release after short time? we need to simulate tap: we'll set a timeout to release
                // but for better control we clear on pointerup too
            } else {
                rightPressed = true;
            }
        });

        // release both on pointerup / pointerleave / pointercancel
        function releasePointer() {
            leftPressed = false;
            rightPressed = false;
        }
        canvas.addEventListener('pointerup', releasePointer);
        canvas.addEventListener('pointerleave', releasePointer);
        canvas.addEventListener('pointercancel', releasePointer);

        // also if pointer moves out while pressed, release? we do via pointerleave

        // restart button
        document.getElementById('resetButton').addEventListener('click', resetGame);

        // Prevent context menu on canvas
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // initialize & start
        resetGame();
        gameLoop();

        // Make sure canvas is focusable? not needed, but window listens
        // extra: on window blur, clear keys
        window.addEventListener('blur', () => {
            leftPressed = false;
            rightPressed = false;
        });

        // Also for mobile: tap left/right side triggers movement, but we release on pointerup.
        // If user holds finger, it will rotate continuously — perfect.
    })();
</script>
</body>
</html>
